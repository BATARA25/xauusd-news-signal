name: Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        run: |
          set -euo pipefail
          base="https://xauusd-news-signal-4i2p.vercel.app"

          health="$(curl -fsS --max-time 20 "$base/api/health")"
          echo "$health"
          echo "$health" | grep -q '"ok":true'

          news="$(curl -fsS --max-time 30 "$base/api/news")"
          echo "News API response received: $(printf '%s' "$news" | wc -c) bytes"
          echo "$news" | grep -q '"ok":true'

          signal="$(curl -fsS --max-time 30 "$base/api/signal")"
          echo "Signal API response received: $(printf '%s' "$signal" | wc -c) bytes"
          echo "$signal" | grep -q '"ok":true'
          echo "$signal" | grep -q '"symbol":"XAUUSD"'

      - name: Check legacy alias
        continue-on-error: true
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 'https://xauusd-news-signal.vercel.app')"
          echo "Legacy alias HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "Legacy alias is not active; canonical production URL is used."
          fi
